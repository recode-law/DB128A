{% extends "DB128A/base.html" %}
{% load static %}

{% block content %}
    <h1>{{ court.name }}</h1>

    <p>
        Sie können Ihre Erkenntnisse zu diesem Gericht gerne mitteilen. ???
    </p>

    <div class="my-3">
        <h3 class="mb-3">Informationen verifizierter Nutzer:</h3>

        <table class="table table-hover table-striped table-bordered">
            <tr>
                <th>Feedback</th>
            </tr>
            {% for feedback in court.ai_feedbacks %}
                <tr>
                    <td>{{ feedback.text }}</td>
                </tr>
            {% endfor %}
        </table>
    </div>
{% endblock %}
