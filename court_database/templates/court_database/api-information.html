{% extends "DB128A/base.html" %}
{% load static %}

{% block content %}
    <h1>API-Dokumentation</h1>
    <p>
        Die Videoverhandlung.de REST API ist für <a href="{% url "user-signup-request" %}">verifizierte Nutzer</a> verfügbar.
    </p>
    <div class="d-flex flex-column gap-4 align-items-center my-3">
        {% for api in apis %}
            {% include "court_database/api-description.html" %}
        {% endfor %}
    </div>

     <div class="position-fixed bottom-0 end-0 p-3" style="z-index: 1100">
        <div id="copyToast" class="toast align-items-center text-bg-success border-0" role="alert" aria-live="assertive" aria-atomic="true">
            <div class="d-flex">
                <div class="toast-body">
                    In die Zwischenablage kopiert
                </div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Schließen"></button>
            </div>
        </div>
    </div>

    <script>
        function copyToClipboard(elementId) {
            const el = document.getElementById(elementId);
            let text = el.innerText || el.textContent;
            if (el.querySelector && el.querySelector('code')) {
                text = el.querySelector('code').innerText;
            }
            navigator.clipboard.writeText(text).then(() => {
                showCopyToast();
            });
        }

        function showCopyToast() {
            const toastEl = document.getElementById('copyToast');
            if (window.bootstrap && window.bootstrap.Toast) {
                const toast = bootstrap.Toast.getOrCreateInstance(toastEl);
                toast.show();
            }
        }
    </script>
{% endblock %}
